[package]
name = "automate-everything"
version = "0.1.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "automate-everything"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", features = ["preserve_order"] }
toml_edit = "0.23"

[profile.release]
strip = true
