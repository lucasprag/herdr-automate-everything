# Pushing a tag like v0.2.0 builds the binary for Apple Silicon and Intel,
# joins them into one universal binary and attaches it to a GitHub release.
# install.sh downloads it, so nobody needs Rust to use the mod.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml and the mod's VERSION
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          pinned=$(tr -d '[:space:]' < app/mods/automate-everything/VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "v$pinned" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match Cargo.toml ($version) and app/mods/automate-everything/VERSION ($pinned)"
            exit 1
          fi

      - name: Build
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Make the universal binary
        run: |
          mkdir dist
          lipo -create -output dist/automate-everything-macos \
            .target/aarch64-apple-darwin/release/automate-everything \
            .target/x86_64-apple-darwin/release/automate-everything
          codesign --force --sign - dist/automate-everything-macos
          dist/automate-everything-macos --version
          cd dist && shasum -a 256 automate-everything-macos > automate-everything-macos.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
